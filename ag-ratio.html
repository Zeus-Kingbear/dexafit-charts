<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- © 2026 DexaFit Scottsdale -->
<meta name="copyright" content="© 2026 DexaFit Scottsdale">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fat pattern — apple vs. pear · DexaFit Scottsdale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/chrome.css?v=4">
<style>
  :root{
    --ink:#10151B; --ink-soft:#3A4753;
    --surface:#FFFFFF; --surface-2:#EEF3F7; --surface-3:#E2EAF0;
    --brand:#0E9BD6; --brand-deep:#0A6F9E; --good:#1A9850; --risk:#D64530;
    font-synthesis:none;
  }
  .seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap;}
  .seg button{border:0;background:transparent;font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;
    color:var(--ink-soft);cursor:pointer;min-height:48px;}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .agewrap{display:flex;align-items:center;gap:14px;min-width:240px;}
  .agewrap input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;
    background:linear-gradient(90deg,var(--brand),var(--surface-3));outline:none;}
  .agewrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
    background:#fff;border:4px solid var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;}
  .agewrap input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--brand);cursor:pointer;}
  .ageval{font-family:"Archivo";font-weight:800;font-size:24px;min-width:42px;text-align:center;}
  .chip{border:2px solid var(--surface-3);background:var(--surface);font:inherit;font-weight:700;padding:13px 18px;
    border-radius:14px;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px;color:var(--ink-soft);}
  .chip .dot{width:14px;height:14px;border-radius:4px;background:var(--surface-3);}
  .chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);}
  .chip[aria-pressed="true"] .dot{background:var(--good);}
  .mrow{display:flex;flex-direction:column;gap:5px;}
  .mlbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .vinput{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:10px;padding:5px 8px;}
  .vinput input{width:84px;border:0;background:#fff;border-radius:7px;padding:8px 8px;font-family:"Inter";font-weight:700;font-size:15px;color:var(--ink);text-align:center;}
  .vinput small{font-size:11px;color:#9aa7b2;}
  .ax{font:600 14px Inter;fill:var(--ink-soft);}
  .axbold{font:800 16px Archivo;fill:var(--ink);}
  @media (max-width:760px){ .ctl-note{display:none;} .topbar{gap:12px;padding:12px 14px;} .agewrap{min-width:170px;} }
</style>
<script src="/assets/chrome.js?v=2"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"></div>
    <div class="spacer"></div>
    <div class="gctl">
      <span class="lbl">Sex</span>
      <div class="seg" id="sexSeg">
        <button data-sex="male" aria-pressed="true">Male</button>
        <button data-sex="female" aria-pressed="false">Female</button>
      </div>
    </div>
    <div class="gctl agewrap">
      <span class="lbl">Age</span>
      <input id="ageRange" type="range" min="20" max="80" value="50" step="1">
      <span class="ageval" id="ageVal">50</span>
    </div>
  </div>

  <div class="chart">
    <div class="chead">
      <div class="ctitle" id="ctitle">Where your body stores fat — the android : gynoid ratio</div>
      <div class="ccontext" id="ctx">Male · age 50</div>
    </div>
    <div class="stage">
      <div class="plot" id="plot"></div>
      <div class="controls" id="controls">
        <div class="mrow"><span class="mlbl">Lens</span>
          <div class="seg" id="metricSeg">
            <button data-metric="ratio" aria-pressed="true">Ratio · bands</button>
            <button data-metric="regions" aria-pressed="false">Regions · %</button>
          </div>
        </div>
        <div class="mrow"><span class="mlbl">Android fat <em style="font-style:normal;text-transform:none;letter-spacing:0;color:#9aa7b2">· belly region, from your report</em></span>
          <div class="vinput"><input id="in_and" type="number" inputmode="decimal" step="0.1" min="1" max="70" placeholder="—"><small>% fat</small></div>
        </div>
        <div class="mrow"><span class="mlbl">Gynoid fat <em style="font-style:normal;text-transform:none;letter-spacing:0;color:#9aa7b2">· hips &amp; thighs, from your report</em></span>
          <div class="vinput"><input id="in_gyn" type="number" inputmode="decimal" step="0.1" min="1" max="70" placeholder="—"><small>% fat</small></div>
        </div>
        <span class="ctl-note" id="note"></span>
      </div>
    </div>
  </div>
</div>



<script>

window.GUIDE_LINK={t:'The Honest Guide to Losing Visceral Fat',u:'https://www.scottsdale.dexafit.com/s/The-Honest-Guide-to-Losing-Visceral-Fat-DexaFit-Scottsdale-y7y5.pdf'};
window.HELP_TITLE="Fat pattern — the android : gynoid ratio";
window.HELP_BODY=`
   <h3>What this is</h3>
   <ul>
     <li>Your DEXA report splits fat by region: <strong>android</strong> (the belly band just above the pelvis) and <strong>gynoid</strong> (hips and thighs). The A/G ratio is simply <strong>android %fat ÷ gynoid %fat</strong> — the two numbers printed on your report. 24.5% ÷ 18.4% = 1.33.</li>
     <li>It measures <em>pattern</em>, not amount: two people at the same body-fat percentage can carry it very differently, and the pattern carries its own risk signal.</li>
   </ul>
   <h3>The bands</h3>
   <ul>
     <li><strong>0.6–0.8</strong> is DexaFit's optimal band and <strong>&lt;1.0</strong> the target — advisory goals, not diagnostic cutoffs. For context, the US adult average (18–59) is <strong>1.09 for men</strong> and <strong>0.90 for women</strong> (NHANES 2011–2018, n=10,014) — so 0.6–0.8 is genuinely aspirational territory, especially for men, whose fittest population subgroup still averages 1.08. Landing above 1.0 puts a man near his national average, not in crisis — the direction of travel matters more than the verdict.</li>
   </ul>
   <h3>Why the pattern matters</h3>
   <ul>
     <li>In normal-weight US adults, the android-gynoid percent-fat ratio tracked cardiometabolic dysregulation <strong>more strongly than android fat, gynoid fat, or BMI</strong> (Okosun 2015, NHANES).</li>
     <li>Prospectively, a higher A/G ratio predicted incident type-2 diabetes in women (HR 1.51), while gynoid fat was <strong>protective</strong> (HR 0.63) — Rotterdam Study. In NHANES 2011–2018, a higher gynoid share protected against obesity comorbidity in both sexes. Hip-and-thigh fat isn't just "less bad" — it appears actively protective.</li>
   </ul>
   <h3>Android is not visceral</h3>
   <ul>
     <li>The android region contains <em>both</em> visceral fat and subcutaneous belly fat. A high ratio with a low visceral number (a real and common combination) means mostly <strong>subcutaneous</strong> android fat — a meaningfully milder risk picture than the same ratio driven by visceral fat. Read this chart alongside your visceral-fat number, which is the sharper single risk marker.</li>
   </ul>
   <h3>Sex, age, and menopause</h3>
   <ul>
     <li>The ratio is strongly sex-dimorphic — testosterone favors android storage, estrogen gynoid — which is why the context markers here are sex-specific. Menopause shifts women android-ward: clinically healthy women averaged 0.99 in the first five years after menopause and 1.05 in years 5–10 (Nistor 2024).</li>
     <li>What moves it: in NHANES, highly active men averaged 1.08 vs 1.12 for inactive men; women 0.88 vs 0.93 — and women's ratio also responded to diet quality (0.87 in the top tertile) while men's barely did. For men, the lever is activity and overall fat loss, not diet composition alone.</li>
   </ul>
   <h3>Honest limits</h3>
   <ul>
     <li>US averages come from a Hologic-scanner survey where two-thirds of adults were overweight or obese; DexaFit scans on GE Lunar, and manufacturers differ slightly — treat context markers as landmarks, not decimals. No published percentile curves exist for this ratio in the percent-fat definition, which is why this chart uses bands and landmarks rather than percentile lines.</li>
   </ul>
   <h3>Sources</h3>
   <ul>
     <li>Xu 2022, Nutrients (NHANES 2011–2018, n=10,014): US means and activity/diet gradients. Okosun 2015, NHANES: ratio vs cardiometabolic dysregulation. Rotterdam Study (Brahimaj 2019): T2D hazard ratios. Fat-distribution &amp; comorbidity, NHANES 2011–2018. Nistor 2024, Medicina: menopause shift. Shepherd 2012: cross-manufacturer standardization.</li>
   </ul>`;

(function(){
const $=id=>document.getElementById(id);
const REF={male:{ag:1.09,and:31.58,gyn:28.82,act:1.08,inact:1.12},
           female:{ag:0.90,and:38.41,gyn:42.29,act:0.88,inact:0.93}};
const MP={early:0.99,late:1.05};
const BANDS=[{a:0.6,b:0.8,c:'#1A9850',t:'DEXAFIT OPTIMAL'},{a:0.8,b:1.0,c:'#8CC98F',t:'ON TARGET · <1.0'},
             {a:1.0,b:1.2,c:'#F0A63A',t:'ABOVE TARGET'},{a:1.2,b:1.6,c:'#E4572E',t:'FOCUS ZONE'}];
const LO=0.4,HI=1.6;
const state={sex:'male',age:50,metric:'ratio',vals:{and:null,gyn:null}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ratio=()=>{const a=state.vals.and,g=state.vals.gyn;return(a!=null&&g!=null&&g>0)?a/g:null;};

function setMeta(){
  const r=REF[state.sex];
  $('ctx').textContent=(state.sex==='male'?'Male':'Female')+' · age '+state.age+' · US avg '+r.ag.toFixed(2);
  $('note').textContent='The A/G ratio is android %fat ÷ gynoid %fat — the two regional numbers on your DexaFit report. DexaFit targets under 1.0, ideally 0.6–0.8; the US adult average is 1.09 for men and 0.90 for women, so treat the bands as a direction of travel, not a pass/fail grade. Hip-and-thigh (gynoid) fat is actively protective, and a high ratio with LOW visceral fat is a milder picture than the same ratio with high visceral — always read this alongside your visceral number.';
}

function renderRatio(){
  const W=1040,H=620,m={l:64,r:44},iw=W-m.l-m.r;
  const X=v=>m.l+(v-LO)/(HI-LO)*iw;
  const r=REF[state.sex],uv=ratio(),by=250,bh=62;
  let s='';
  s+=`<text x="${m.l}" y="70" class="axbold" font-size="21">WHERE DOES YOUR FAT LIVE?</text>`;
  s+=`<text x="${m.l}" y="96" class="ax">android (belly) ÷ gynoid (hips &amp; thighs) — pattern, not amount</text>`;
  for(const b of BANDS){
    s+=`<rect x="${X(b.a)}" y="${by}" width="${X(b.b)-X(b.a)}" height="${bh}" fill="${b.c}" opacity="${b.c==='#1A9850'?0.9:0.75}"/>`;
    s+=`<text x="${(X(b.a)+X(b.b))/2}" y="${by-12}" text-anchor="middle" style="font:800 11.5px Inter" fill="#5D6E7C" letter-spacing="1">${b.t}</text>`;
  }
  s+=`<rect x="${X(LO)}" y="${by}" width="${X(0.6)-X(LO)}" height="${bh}" fill="#DCE4EA" opacity="0.7"/>`;
  for(let v=LO;v<=HI+0.001;v+=0.2){
    s+=`<line x1="${X(v)}" y1="${by+bh}" x2="${X(v)}" y2="${by+bh+8}" stroke="#9aa7b2" stroke-width="2"/>`;
    s+=`<text x="${X(v)}" y="${by+bh+28}" text-anchor="middle" class="ax">${v.toFixed(1)}</text>`;
  }
  s+=`<line x1="${X(1.0)}" y1="${by-34}" x2="${X(1.0)}" y2="${by+bh}" stroke="#10151B" stroke-width="3" stroke-dasharray="6 5"/>`;
  // sex context landmarks
  const my=by+bh+52;
  s+=`<g><path d="M ${X(r.ag)-9} ${my+16} L ${X(r.ag)+9} ${my+16} L ${X(r.ag)} ${my} Z" fill="#10151B"/>
      <text x="${X(r.ag)}" y="${my+36}" text-anchor="middle" style="font:800 12.5px Inter" fill="#10151B">US ${state.sex==='male'?'MEN':'WOMEN'} AVG ${r.ag.toFixed(2)}</text>
      <text x="${X(r.ag)}" y="${my+53}" text-anchor="middle" style="font:600 11px Inter" fill="#9aa7b2">NHANES 18–59</text></g>`;
  s+=`<g><line x1="${X(r.act)}" y1="${my}" x2="${X(r.act)}" y2="${my+14}" stroke="#0A6F9E" stroke-width="3"/>
      <text x="${X(r.act)}" y="${my+70}" text-anchor="middle" style="font:700 11.5px Inter" fill="#0A6F9E">highly active ${r.act.toFixed(2)}</text></g>`;
  if(state.sex==='female'){
    const y2=by-58;
    s+=`<line x1="${X(MP.early)}" y1="${y2}" x2="${X(MP.late)}" y2="${y2}" stroke="#8a4d9e" stroke-width="3" marker-end="url(#arr)"/>
        <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a4d9e"/></marker></defs>
        <text x="${(X(MP.early)+X(MP.late))/2}" y="${y2-10}" text-anchor="middle" style="font:700 11.5px Inter" fill="#8a4d9e">menopause shift 0.99 → 1.05</text>`;
  }
  if(uv!==null){
    const ux=Math.max(X(LO),Math.min(X(HI),X(uv)));
    s+=`<line x1="${ux}" y1="${by-46}" x2="${ux}" y2="${by+bh+10}" stroke="#10151B" stroke-width="4"/>
        <circle cx="${ux}" cy="${by+bh/2}" r="15" fill="#10151B" stroke="#fff" stroke-width="4"/>
        <g transform="translate(${ux},${by-72})"><rect x="-58" y="-26" width="116" height="40" rx="10" fill="#10151B"/>
        <text x="0" y="2" text-anchor="middle" style="font:900 20px Archivo" fill="#fff">YOU · ${uv.toFixed(2)}</text></g>`;
    const band=uv<0.6?'below the optimal band':uv<=0.8?'in the DexaFit optimal band':uv<1.0?'on target — under 1.0':uv<1.2?'above target':'in the focus zone';
    const rel=uv<r.ag?(r.ag-uv).toFixed(2)+' under':(uv-r.ag).toFixed(2)+' over';
    s+=`<text x="${m.l}" y="486" style="font:800 17px Archivo" fill="#10151B">${esc(state.vals.and.toFixed(1))}% ÷ ${esc(state.vals.gyn.toFixed(1))}% = ${uv.toFixed(2)} — ${band}</text>`;
    s+=`<text x="${m.l}" y="512" class="ax">${rel} the US ${state.sex==='male'?'men\u2019s':'women\u2019s'} average · ${uv>=1.0?('reaching <1.0 means dropping android fat or building the gynoid side of the equation'):'the pattern side of your fat picture is working for you'}</text>`;
  } else {
    s+=`<text x="${m.l}" y="486" style="font:800 16px Archivo" fill="#5D6E7C">Enter your android and gynoid %fat from the report to place yourself.</text>`;
  }
  s+=`<text x="${m.l}" y="576" style="font:600 12px Inter" fill="#9aa7b2">Context markers are US adults 18–59 (NHANES 2011–2018) — the age slider doesn't move them. Pattern ≠ amount: read alongside your visceral-fat number.</text>`;
  $('plot').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Android to gynoid ratio bands">${s}</svg>`;
}

function renderRegions(){
  const W=1040,H=620,m={l:110,t:110,b:90},ih=H-m.t-m.b;
  const Y=v=>m.t+ih-(v/50)*ih;
  const r=REF[state.sex],uv=ratio();
  const cols=[{k:'and',x:330,c:'#E4572E',lbl:'ANDROID',sub:'belly · "apple"',ref:r.and},
              {k:'gyn',x:640,c:'#0A6F9E',lbl:'GYNOID',sub:'hips &amp; thighs · "pear"',ref:r.gyn}];
  let s='';
  s+=`<text x="${m.l-46}" y="70" class="axbold" font-size="21">THE TWO REGIONS, SIDE BY SIDE</text>`;
  for(let v=0;v<=50;v+=10){
    s+=`<line x1="${m.l}" y1="${Y(v)}" x2="${W-60}" y2="${Y(v)}" stroke="#E7EDF2" stroke-width="${v===0?3:1.5}"/>
        <text x="${m.l-12}" y="${Y(v)+5}" text-anchor="end" class="ax">${v}%</text>`;
  }
  for(const c of cols){
    const val=state.vals[c.k];
    if(val!=null){
      s+=`<rect x="${c.x}" y="${Y(val)}" width="120" height="${Y(0)-Y(val)}" rx="10" fill="${c.c}" opacity="0.88"/>
          <text x="${c.x+60}" y="${Y(val)-14}" text-anchor="middle" style="font:900 22px Archivo" fill="${c.c}">${val.toFixed(1)}%</text>`;
    } else {
      s+=`<rect x="${c.x}" y="${Y(20)}" width="120" height="${Y(0)-Y(20)}" rx="10" fill="#DCE4EA"/>
          <text x="${c.x+60}" y="${Y(20)-14}" text-anchor="middle" style="font:800 15px Inter" fill="#9aa7b2">enter %</text>`;
    }
    s+=`<line x1="${c.x-14}" y1="${Y(c.ref)}" x2="${c.x+134}" y2="${Y(c.ref)}" stroke="#10151B" stroke-width="3" stroke-dasharray="7 5"/>
        <text x="${c.x+140}" y="${Y(c.ref)+5}" style="font:700 12px Inter" fill="#10151B">US ${state.sex==='male'?'M':'W'} avg ${c.ref.toFixed(1)}%</text>`;
    s+=`<text x="${c.x+60}" y="${Y(0)+34}" text-anchor="middle" style="font:800 15px Archivo" fill="#10151B">${c.lbl}</text>
        <text x="${c.x+60}" y="${Y(0)+54}" text-anchor="middle" style="font:600 12px Inter" fill="#9aa7b2">${c.sub}</text>`;
  }
  if(uv!==null){
    s+=`<g transform="translate(${W-210},${m.t+30})"><rect x="-84" y="-30" width="168" height="76" rx="14" fill="#10151B"/>
        <text x="0" y="-4" text-anchor="middle" style="font:600 12px Inter" fill="#9aa7b2">A ÷ G RATIO</text>
        <text x="0" y="30" text-anchor="middle" style="font:900 30px Archivo" fill="#fff">${uv.toFixed(2)}</text></g>`;
  }
  s+=`<text x="${m.l-46}" y="${H-26}" style="font:600 12px Inter" fill="#9aa7b2">${state.sex==='male'?'Men typically store android-forward — both US-average lines sit close together.':'Women typically store gynoid-forward — the gynoid average sits well above the android one. That gap is protective.'}</text>`;
  $('plot').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Android and gynoid regional fat">${s}</svg>`;
}

function render(){ setMeta(); (state.metric==='ratio'?renderRatio:renderRegions)(); }

/* ---- wiring ---- */
$('metricSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  state.metric=b.dataset.metric;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('sexSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  state.sex=b.dataset.sex;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('ageRange').addEventListener('input',e=>{state.age=+e.target.value;$('ageVal').textContent=state.age;setMeta();});
function readInputs(){
  const a=parseFloat($('in_and').value),g=parseFloat($('in_gyn').value);
  state.vals.and=isFinite(a)?a:null; state.vals.gyn=isFinite(g)?g:null;
}
['in_and','in_gyn'].forEach(id=>$(id).addEventListener('input',()=>{readInputs();busReport(id);render();}));

/* ---- value bus ---- */
let busMute=false;
function busReport(id){ if(busMute||window.parent===window) return;
  const key=id==='in_and'?'android':'gynoid';
  const v=state.vals[id==='in_and'?'and':'gyn'];
  window.parent.postMessage({type:'val',id:key,v:(v!=null&&isFinite(v))?v:null},'*'); }
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.type==='sa'){ if(d.sex){state.sex=d.sex;[...$('sexSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.sex===d.sex));}
    if(d.age){state.age=d.age;$('ageRange').value=d.age;$('ageVal').textContent=d.age;} render(); }
  if(d.type==='vals'&&d.vals){ busMute=true;
    if(d.vals.android!==undefined){state.vals.and=d.vals.android;$('in_and').value=d.vals.android??'';}
    if(d.vals.gynoid!==undefined){state.vals.gyn=d.vals.gynoid;$('in_gyn').value=d.vals.gynoid??'';}
    busMute=false; render(); } });

render();
})();
</script>
</body>
</html>
